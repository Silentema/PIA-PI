<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cómo la Béisbol</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <button class="icon menu" aria-label="Abrir menú">
        <svg width="35" height="35" viewBox="0 0 35 35" fill="none">
          <path
            d="M4.375 17.5H30.625M4.375 8.75H30.625M4.375 26.25H30.625"
            stroke="white"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <div class="brand">
        <h1>Cómo la Béisbol</h1>
        <p>BÉISBOL EN REALIDAD AUMENTADA</p>
      </div>

      <button class="icon camera" aria-label="Escanear">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M9 3 7.5 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.5L15 3H9Z"
            stroke="#111"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
          <circle
            cx="12"
            cy="13"
            r="3.5"
            stroke="#111"
            stroke-width="1.7"
          />
        </svg>
      </button>
    </header>

    <section class="slider" aria-label="Carrusel de imágenes">
      <div class="slides">
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="slide"></div>
      </div>

      <button class="arrow previous" aria-label="Imagen anterior">
        <svg width="16" height="18" viewBox="0 0 16 18" fill="none">
          <path
            d="M11 17 4 9l7-8"
            stroke="white"
            stroke-width="2"
          />
        </svg>
      </button>

      <button class="arrow next" aria-label="Siguiente imagen">
        <svg width="16" height="18" viewBox="0 0 16 18" fill="none">
          <path
            d="m5 1 7 8-7 8"
            stroke="white"
            stroke-width="2"
          />
        </svg>
      </button>

      <div class="dots" aria-hidden="true">
        <i class="dot active"></i>
        <i class="dot"></i>
        <i class="dot"></i>
        <i class="dot"></i>
        <i class="dot"></i>
        <i class="dot"></i>
      </div>
    </section>

    <div class="divider"></div>

    <section class="sections" aria-label="Secciones">
      <a class="card-link" href="AR.html" aria-label="Abrir escáner de realidad aumentada">
        <article class="card scan">
          <span>ESCANEAR</span>
        </article>
      </a>

      <article class="card teams">
        <span>EQUIPOS</span>
      </article>

      <article class="card game">
        <span>MINIJUEGO</span>
      </article>

      <article class="card trivia">
        <span>TRIVIA</span>
      </article>

      <article class="card history">
        <span>HISTORIA</span>
      </article>

      <article class="card gallery">
        <span>GALERÍA</span>
      </article>
    </section>
  </main>
</body>
</html>

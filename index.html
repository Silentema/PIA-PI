<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Como la beisbol</title>
        <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
                padding: 1rem;
                background: #f4f4f4;
            }

            #ar-button {
                width: 200px;
                height: 50px;
                position: absolute;
                bottom: 1rem;
                right: 1rem;
                z-index: 10;
                background: rgba(255, 255, 255, 0.9);
                border: 1px solid #ccc;
                border-radius: 8px;
                color: #000;
                cursor: pointer;
            }

            model-viewer {
                width: 100%;
                max-width: 400px;
                height: 600px;
                background: #000;
                position: relative;
            }

            a {
                color: #0066cc;
                text-decoration: none;
                
            }
        </style>
    </head>
    <body>
        <model-viewer
            src="assets/Silla-de-angel-para-AR.glb"
            ar
            ar-modes="scene-viewer webxr quick-look"
            camera-controls
            tone-mapping="neutral"
            poster="assets/5.png"
            shadow-intensity="1"
            auto-rotate>
            <div class="progress-bar hide" slot="progress-bar">
                <div class="update-bar"></div>
            </div>
            
            <div id="ar-prompt">
                <img src="https://modelviewer.dev/shared-assets/icons/hand.png" alt="AR prompt" />
            </div>
        </model-viewer>
        <button slot="ar-button" id="ar-button">View in your space</button>

        <a href="https://www.fcfm.uanl.mx">Link de la pagina de la facu</a>
    </body>
</html>

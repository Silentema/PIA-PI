<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Como la beisbol</title>
        <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
        <link rel="stylesheet" href="css/style.css">    
    </head>
    <body>


        <main class="page">
    <header class="header">
      <button class="icon menu" aria-label="Abrir menú">
        <svg width="35" height="35" viewBox="0 0 35 35" fill="none">
          <path
            d="M4.375 17.5H30.625M4.375 8.75H30.625M4.375 26.25H30.625"
            stroke="white"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <div class="brand">
        <h1>Cómo la Béisbol</h1>
        <p>BÉISBOL EN REALIDAD AUMENTADA</p>
      </div>

      <button class="icon camera" aria-label="Escanear">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M9 3 7.5 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.5L15 3H9Z"
            stroke="#111"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
          <circle
            cx="12"
            cy="13"
            r="3.5"
            stroke="#111"
            stroke-width="1.7"
          />
        </svg>
      </button>
    </header>





        <div class="model-viewer-container">
            <model-viewer 
            src="assets/Silla-de-angel-para-AR.glb"
            ar
            ar-modes="scene-viewer webxr quick-look"
            camera-controls
            tone-mapping="neutral"
            poster="assets/5.png"
            shadow-intensity="1"
            auto-rotate
            class="model-viewer"
            >
            <div class="progress-bar hide" slot="progress-bar">
                <div class="update-bar"></div>
            </div>
            
            
            </model-viewer>
            
            

            <model-viewer 
            src="assets/resetVectorsv2.glb" 
            ar 
            ar-modes="scene-viewer webxr quick-look" 
            camera-controls 
            tone-mapping="neutral" 
            poster="assets/Rui.png" 
            shadow-intensity="1" 
            autoplay
            class="model-viewer">
                <div class="progress-bar hide" slot="progress-bar">
                    <div class="update-bar"></div>
                </div>
                <button slot="ar-button" class="ar-button">Ver en realidad aumentada</button>
            </model-viewer>

            
        </div>

        
        




        

        
    </body>
</html>

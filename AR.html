<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Como la beisbol</title>
        <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
        <link rel="stylesheet" href="css/style.css">    
    </head>
    <body>


    <main class="page">
      <div id="header-container">
        <!-- El contenido del header se carga aquí mediante JavaScript asi creo que es mas facil de enteder, mas modular xd -->
      </div>
      

      <div class="contenedor-general"> <!--No se como ponerle la esctructura a este div xd-->
        <h2 class="titulo-interior">Escanear</h2>
        <div class="model-viewer-container">
            <!---Modelo de la silla-->
            <model-viewer 
            src="assets/Silla-de-angel-para-AR.glb"
            ar
            ar-modes="scene-viewer webxr quick-look"
            camera-controls
            tone-mapping="neutral"
            poster="assets/5.png"
            shadow-intensity="1"
            auto-rotate
            ar-scale="fixed"
            scale="0.5 0.5 0.5"
            class="model-viewer"
            >
              <div class="progress-bar hide" slot="progress-bar">
                  <div class="update-bar"></div>
              </div>
           </model-viewer>
              
           <!---Modelo Rui-->
            <model-viewer 
            src="assets/resetVectorsv2.glb" 
            ar 
            ar-modes="scene-viewer webxr quick-look" 
            camera-controls 
            tone-mapping="neutral" 
            poster="assets/Rui.png" 
            shadow-intensity="1" 
            autoplay
            ar-scale="fixed"
            scale="0.5 0.5 0.5"
            class="model-viewer">
                <div class="progress-bar hide" slot="progress-bar">
                    <div class="update-bar"></div>
                </div>
            </model-viewer>

            <!---Modelo Don Chepo-->
            <model-viewer 
            src="assets/DonChepo.glb" 
            ar 
            ar-modes="scene-viewer webxr quick-look" 
            camera-controls 
            tone-mapping="neutral" 
            poster="assets/DonChepo.png" 
            shadow-intensity="1" 
            autoplay
            ar-scale="fixed"
            scale="0.5 0.5 0.5"
            class="model-viewer">
                <div class="progress-bar hide" slot="progress-bar">
                    <div class="update-bar"></div>
                </div>
            </model-viewer>
          </div>
      </div>
    </main>
    <script src="js/javascript.js"></script>
    </body>
</html>
